# Caption images with Qwen3.5/Qwen3-VL/Qwen2.5-VL models.
#
# Run:
#   python tools/qwen_vl_caption.py examples/qwen_vl_caption.toml
#   python tools/qwen_vl_caption.py examples/qwen_vl_caption.toml --dry-run

[run]
mode = "caption"

[model]
# Use exactly one of:
# - source = "Qwen/Qwen3.5-2B"
# - source = "Qwen3-VL-2B-Instruct"
# - path = "/absolute/path/to/local/model"
source = "qwen3.5-2B"

# Optional search roots when source/name is a bare local model name.
search_paths = ["/home/pyro/repos/ComfyUI/models/LLM/Qwen-VL"]

device = "cuda"
dtype = "bfloat16"
quantization = "none"          # "none", "4bit", "8bit"
attn_implementation = "auto"   # "auto", "sdpa", "flash_attention_2", "eager"
local_files_only = false
trust_remote_code = false

# Optional resolution controls to cap VRAM / speed.
# min_pixels = 262144
# max_pixels = 1048576

[input]
path = "/home/pyro/projects/private/flux2_klein_trainer/data/art-style"
recursive = true
extensions = [".png", ".jpg", ".jpeg", ".webp"]
# max_images = 100

[prompt]
instruction = """
Write one clean training caption for this image.
Only describe concrete visible subjects, attributes, clothing, actions, and setting.
Do not describe art style, medium, texture treatment, glitch effects, composition, symbolism, or mood.
Keep it to one short plain sentence.
No lists, no markdown, no preface, no reasoning, no <think>.
"""

system_prompt = """
You write literal image captions for diffusion training datasets.
Only mention concrete visible entities and attributes.
Do not mention artistic style, medium, rendering technique, texture treatment, composition, mood, symbolism, or subjective interpretation.
"""

strip_think = true
strip_code_fences = true
collapse_whitespace = true
trim_whitespace = true

[generation]
batch_size = 4
max_new_tokens = 220
enable_thinking = false       # Qwen3.5 chat-template switch; omit to keep model default.
do_sample = false
temperature = 0.2
top_p = 0.9
num_beams = 1
repetition_penalty = 1.05
seed = 1

[output]
format = "both"                # "txt", "jsonl", "both"
prepend = "brk_stl,"

# If empty, .txt captions are written next to the source image as sidecars.
# If set, relative paths are mirrored under this folder instead.
# txt_root = "/path/to/caption_txts"

# Optional; default is <config filename>.captions.jsonl when format uses jsonl.
# jsonl_path = "/path/to/captions.jsonl"

# Optional trigger words or fixed affixes added to every written caption.
# prepend = "my_trigger,"
# append = "highly detailed"

overwrite = true
include_metadata = false

[run]
name = "flux2-smoke"
architecture = "flux2"
seed = 42

[accelerate]
num_cpu_threads_per_process = 1
mixed_precision = "bf16"

[model]
version = "klein-base-9b"
dit = "/models/flux2.safetensors"
vae = "/models/ae.safetensors"
text_encoder = "/models/text-encoder.safetensors"
sdpa = true
fp8_base = true
fp8_scaled = true

[training]
timestep_sampling = "flux2_shift"
weighting_scheme = "none"
gradient_checkpointing = true
learning_rate = 0.0002
max_grad_norm = 0
max_train_epochs = 1
save_every_n_epochs = 1
max_data_loader_n_workers = 2
persistent_data_loader_workers = true

[optimizer]
type = "adafactor"
lr_scheduler = "constant"

[optimizer.args]
scale_parameter = false
relative_step = false
warmup_init = false

[network]
module = "networks.lora_flux_2"
dim = 16
alpha = 16

[performance]
compile_dynamic = true
compile_prewarm = true
cuda_allow_tf32 = true

[output]
dir = "/tmp/northstar/flux2-smoke"
name = "flux2-smoke"
logging_dir = "/tmp/northstar/flux2-smoke"

[sampling]
enabled = true
sample_at_first = true
sample_every_n_steps = 50

[[sampling.loras]]
path = "/models/sample-lora.safetensors"
multiplier = 0.6

[[sampling.prompts]]
prompt = "a studio portrait"
width = 832
height = 1216
steps = 6
seed = 6666
guidance = 4
negative_prompt = " "

[[dataset.groups]]
resolution = [320, 320]
batch_size = 4
enable_bucket = true
bucket_no_upscale = false
cache_directory = "cache/flux2-smoke"
caption_extension = ".txt"

[[dataset.groups.sources]]
image_directory = "/datasets/flux2-smoke"
num_repeats = 1

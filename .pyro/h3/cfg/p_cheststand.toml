# frame_count = 1
sample_steps = 4
sample_solver = "euler"  # AB2 extrapolation explodes at 4-step schedules

# Video also works
width = 640
height = 480
frame_count = 161

# Bare trigger prompt: measures raw trigger binding, comparable with all
# earlier previews (same seed 42 lineage).
[[prompt.subset]]
prompt = "a woman lying on her chest with her legs bend over her"
seed = 42


[[prompt.subset]]
prompt = "tik tok reel of a young but pretty gothic girl lying on a table on her chest with her legs bend over her in her kitchen"
seed = 43


